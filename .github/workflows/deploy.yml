name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build project
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: "https://wxqkltocjmtxjbvxfxfc.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4cWtsdG9jam10eGpidnhmeGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MjkzNjgsImV4cCI6MjEwNjEwNTM2OH0.IutYEeJLCpiOLVLfk3FHio9AoJuKwie2Yj-VdGua1ZU"
          VITE_SUPABASE_PROJECT_ID: "wxqkltocjmtxjbvxfxfc"
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
